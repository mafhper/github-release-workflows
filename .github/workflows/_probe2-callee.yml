name: Probe2 callee

on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: false
        default: '[{"os":"ubuntu-latest"}]'
      config-file:
        type: string
        required: false
        default: '.github/release.config.json'
      tag:
        type: string
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do projeto consumidor (histórico completo)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Echo
        run: echo "probe2 ok"